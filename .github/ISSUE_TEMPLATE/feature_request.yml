name: 功能建议
description: 提议新的使用场景或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述实际使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
  - type: checkboxes
    id: scope
    attributes:
      label: 安全边界
      options:
        - label: 这个建议不需要写入游戏存档、修改随机数、伪造捕获结果或访问认证令牌。
          required: true
